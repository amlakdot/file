<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>املاک DOT | فایل‌ها</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN -->
    <section id="loginPage" class="login-page">

        <div class="login-box">

            <div class="logo">DOT</div>

            <h1>املاک دات</h1>
            <p>ورود به سیستم فایل‌ها</p>

            <form id="loginForm">

                <label>کد دسترسی</label>

                <input
                    type="password"
                    id="accessCode"
                    placeholder="کد دسترسی را وارد کنید"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    ورود
                </button>

                <div id="loginError" class="error"></div>

            </form>

        </div>

    </section>


    <!-- APP -->
    <section id="app" class="app hidden">

        <header class="header">

            <div>
                <div class="brand">DOT</div>
                <span>مدیریت فایل‌ها</span>
            </div>

            <button id="logoutBtn" class="logout">
                خروج
            </button>

        </header>


        <main class="container">

            <!-- TOP -->
            <div class="topbar">

                <div>
                    <h2>فایل‌ها</h2>
                    <p id="fileCount">0 فایل</p>
                </div>

                <button id="addFileBtn" class="primary">
                    + افزودن فایل
                </button>

            </div>


            <!-- FILTERS -->
            <div class="filters">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="جستجوی کد، محله، توضیحات..."
                >

                <select id="typeFilter">

                    <option value="all">همه فایل‌ها</option>
                    <option value="sale">فروش</option>
                    <option value="rent">اجاره</option>
                    <option value="buyer">خریدار</option>
                    <option value="tenant">مستأجر</option>
                    <option value="landlord">موجر</option>

                </select>

                <select id="statusFilter">

                    <option value="all">همه وضعیت‌ها</option>
                    <option value="active">فعال</option>
                    <option value="reserved">رزرو</option>
                    <option value="sold">فروخته شد</option>
                    <option value="archived">بایگانی</option>

                </select>

            </div>


            <!-- FILES -->
            <div id="filesContainer" class="files-grid"></div>

        </main>

    </section>


    <!-- MODAL -->
    <div id="modal" class="modal hidden">

        <div class="modal-box">

            <div class="modal-header">

                <h2 id="modalTitle">
                    افزودن فایل
                </h2>

                <button id="closeModal" class="close">
                    ×
                </button>

            </div>


            <form id="fileForm">

                <input type="hidden" id="fileId">


                <div class="form-grid">

                    <!-- TYPE -->

                    <div class="field full">

                        <label>نوع فایل</label>

                        <select id="fileType" required>

                            <option value="sale">فروش</option>
                            <option value="rent">اجاره</option>
                            <option value="buyer">خریدار</option>
                            <option value="tenant">مستأجر</option>
                            <option value="landlord">موجر</option>

                        </select>

                    </div>


                    <!-- PUBLIC -->

                    <div class="field">

                        <label>کد فایل</label>

                        <input
                            id="code"
                            placeholder="مثلاً DOT-1024"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>نوع ملک</label>

                        <input
                            id="propertyType"
                            placeholder="آپارتمان، زمین..."
                        >

                    </div>


                    <div class="field">

                        <label>متراژ</label>

                        <input
                            id="area"
                            type="number"
                            placeholder="120"
                        >

                    </div>


                    <div class="field">

                        <label>تعداد خواب</label>

                        <input
                            id="rooms"
                            type="number"
                            placeholder="2"
                        >

                    </div>


                    <div class="field">

                        <label>طبقه</label>

                        <input
                            id="floor"
                            placeholder="3"
                        >

                    </div>


                    <div class="field">

                        <label>سن بنا</label>

                        <input
                            id="age"
                            placeholder="1 سال"
                        >

                    </div>


                    <div class="field">

                        <label>محله</label>

                        <input
                            id="location"
                            placeholder="محله"
                        >

                    </div>


                    <div class="field">

                        <label>قیمت</label>

                        <input
                            id="price"
                            placeholder="مثلاً ۴ میلیارد"
                        >

                    </div>


                    <div class="field full">

                        <label>توضیحات عمومی</label>

                        <textarea
                            id="description"
                            rows="3"
                            placeholder="اطلاعاتی که مشاورها باید ببینند..."
                        ></textarea>

                    </div>


                    <!-- PRIVATE -->

                    <div class="private-title full">
                        🔒 اطلاعات خصوصی
                    </div>


                    <div class="field">

                        <label>نام مالک / شخص</label>

                        <input id="ownerName">
                    </div>


                    <div class="field">

                        <label>شماره تماس</label>

                        <input
                            id="ownerPhone"
                            type="tel"
                        >

                    </div>


                    <div class="field full">

                        <label>آدرس دقیق</label>

                        <textarea
                            id="exactAddress"
                            rows="2"
                        ></textarea>

                    </div>


                    <div class="field full">

                        <label>یادداشت داخلی</label>

                        <textarea
                            id="privateNotes"
                            rows="3"
                            placeholder="فقط برای مشاورها..."
                        ></textarea>

                    </div>


                    <div class="field">

                        <label>وضعیت</label>

                        <select id="status">

                            <option value="active">فعال</option>
                            <option value="reserved">رزرو</option>
                            <option value="sold">فروخته شد</option>
                            <option value="archived">بایگانی</option>

                        </select>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary"
                    >
                        لغو
                    </button>

                    <button
                        type="submit"
                        class="primary"
                    >
                        ذخیره فایل
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
