<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d0f">
    <meta name="description" content="فایل‌های املاک DOT">
    <title>فایل‌های املاک | DOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      .public-page {
        min-height: 100vh;
        padding-bottom: 40px;
      }
      .public-hero {
        padding: 28px 20px 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(11, 13, 15, 0.96);
      }
      .public-hero-inner {
        max-width: 1100px;
        margin: 0 auto;
      }
      .public-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .public-brand .brand-mark {
        width: 42px;
        height: 42px;
      }
      .public-title {
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 6px;
      }
      .public-subtitle {
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.7;
        margin: 0;
      }
      .public-contact {
        margin-top: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(85, 184, 120, 0.12);
        border: 1px solid rgba(85, 184, 120, 0.3);
        color: #8fd4a8;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.7;
        text-align: center;
      }
      .public-contact a {
        color: #b8ecc8;
        text-decoration: none;
        letter-spacing: 0.02em;
        direction: ltr;
        unicode-bidi: isolate;
        display: inline-block;
      }
      .public-contact a:hover {
        text-decoration: underline;
      }
      .public-toolbar {
        max-width: 1100px;
        margin: 18px auto 0;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .public-meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        color: var(--text-muted);
        font-size: 12px;
        flex-wrap: wrap;
      }
      .public-meta-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .public-refresh-btn {
        padding: 8px 12px;
        font-size: 12px;
        white-space: nowrap;
      }
      .public-refresh-btn.is-loading {
        opacity: 0.7;
        pointer-events: none;
      }
      .public-card {
        cursor: default;
      }
      .public-card:hover {
        transform: none;
      }
      #publicFiles {
        max-width: 1100px;
        margin: 16px auto;
        padding: 0 16px 24px;
      }
      #publicEmpty {
        max-width: 480px;
        margin: 40px auto;
        text-align: center;
        color: var(--text-muted);
      }
    </style>
</head>
<body>
    <div class="public-page">
        <header class="public-hero">
            <div class="public-hero-inner">
                <div class="public-brand">
                    <div class="brand-mark">DOT</div>
                    <div>
                        <div class="brand-name">املاک DOT</div>
                        <div class="brand-subtitle">فایل‌های ملکی</div>
                    </div>
                </div>
                <h1 class="public-title">فایل‌های ملکی</h1>
                <p class="public-subtitle">مشاهده مشخصات ملک‌ها</p>
                <div class="public-contact">
                    برای دریافت اطلاعات بیشتر با شماره
                    <a href="tel:09157994006">0915&nbsp;799&nbsp;4006</a>
                    تماس بگیرید
                </div>
            </div>
        </header>

        <div class="public-toolbar">
            <div class="search-box md-search">
                <span class="search-icon">⌕</span>
                <input id="publicSearch" type="search" placeholder="جست‌وجو: منطقه، متراژ، نوع ملک..." autocomplete="off">
            </div>
            <div id="publicFilters" class="filters md-chip-row"></div>
            <div class="public-meta-row">
                <span id="publicCount">—</span>
                <div class="public-meta-actions">
                    <span id="publicStatus">…</span>
                    <button id="publicRefreshButton" class="header-button public-refresh-btn" type="button" title="دریافت آخرین فایل‌ها از منبع">
                        به‌روزرسانی
                    </button>
                </div>
            </div>
        </div>

        <div id="publicFiles" class="files-grid"></div>

        <div id="publicEmpty" class="hidden">
            <div class="empty-icon">⌂</div>
            <h2>فایلی برای نمایش نیست</h2>
            <p>هنوز فایلی منتشر نشده یا با این فیلتر نتیجه‌ای نیست.</p>
        </div>
    </div>

    <script type="module" src="js/public-app.js"></script>
</body>
</html>
