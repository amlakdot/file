name = "dot-real-estate-api"
main = "src/index.js"
compatibility_date = "2026-09-03"

# ---------------------------------------------------------
# Worker variables
# ---------------------------------------------------------

[vars]

# فقط دامنه GitHub Pages را بنویس.
# مسیر /file را اینجا ننویس.
#
# مثال:
# ALLOWED_ORIGIN = "https://amlakdot.github.io"
#
# اگر username گیت‌هاب چیز دیگری است، همین مقدار را
# مطابق آدرس واقعی GitHub Pages تغییر بده.

ALLOWED_ORIGIN = "https://amlakdot.github.io"


# ---------------------------------------------------------
# D1 Database
# ---------------------------------------------------------

[[d1_databases]]

binding = "DB"
database_name = "dot-real-estate"
database_id = "PUT-YOUR-D1-DATABASE-ID-HERE"
